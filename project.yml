name: ClipdMac
options:
  deploymentTarget: { macOS: "15.0" }
  createIntermediateGroups: true

packages:
  ClipdCore:
    path: .                     # the SwiftPM package in this same folder
  # Prebuilt binary target, 176K to check out. Rejected: GRDB, whose SQLCipher
  # support is not a selectable product. Its own Package.swift says "uncomment
  # those lines", and a dependency's manifest cannot be edited by its consumer,
  # so using it would mean forking and maintaining GRDB.
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    from: 4.17.0

targets:
  ClipdMac:
    type: application
    platform: macOS
    sources:
      - ClipdMac
      # The icns is built by ./app icons with iconutil, not by the asset
      # catalog. Measured: Xcode 26's compiler silently dropped the 256, 512
      # and 1024 entries from a scale-based AppIcon set, leaving the Dock and
      # Get Info with no large artwork.
      - path: art/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: ClipdCore
        product: ClipdCore
      - package: SQLCipher
        product: SQLCipher
    info:
      path: ClipdMac/Info.plist
      properties:
        CFBundleName: Clipd
        CFBundleIconFile: AppIcon
        # Set explicitly. Without it XcodeGen's generated plist defaults to 1.0,
        # so the DMG filename disagreed with the version the app reports.
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        # Menu bar only. No Dock icon, no main window on launch.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hengkysandy.clipd.mac
        SWIFT_VERSION: "6.0"
        # Regenerate the artwork with: swift tools/makeicon.swift <dir>
        # Drawn in code so the shape stays editable and the repo carries no
        # opaque blob whose source nobody has.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ad-hoc signing is NOT the default here, unlike the usual advice.
        # Measured: under ad-hoc the CDHash changes on every build and macOS
        # drops the Accessibility permission with it, after which the app
        # looks perfectly healthy and pastes nothing at all. A real
        # certificate gives a designated requirement of identifier plus
        # certificate, with no CDHash in it, which survives rebuilds.
        # The ./app script injects the identity; these are only fallbacks.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  ClipdMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClipdMacTests]
    dependencies: [target: ClipdMac]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # No `info:` block above, so XcodeGen has no plist path to generate.
        # Without this, code signing the test bundle fails.
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ClipdMac:
    build: { targets: { ClipdMac: all } }
    test: { targets: [ClipdMacTests] }
    run: { config: Debug }
